[package]
name = "qp-render"
description = "Qapsule render core (headless reference renderer)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Enables tiny-skia's SIMD pipelines. Off by default: the reference renderer
# favours the scalar path for cross-target determinism (see SPIKE.md).
simd = ["tiny-skia/simd"]

[dependencies]
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
fontdue = { version = "0.9.5", default-features = false }
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
