[package]
name = "t6b-encoding"
version = "0.0.0"
edition = "2021"
publish = false
description = "RD1/T6b experiment: protocol encodings (JSON vs binary vs columnar). Not a workspace member."

# Own workspace: keeps this experiment out of the main workspace and its feature resolution.
[workspace]

[dependencies]
qp-schema = { path = "../../crates/qp-schema" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
ciborium = "0.2.2"
minicbor-serde = { version = "0.7.2", features = ["alloc"] }
rmp-serde = "1.3.1"
postcard = { version = "1.1.3", features = ["alloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2 = "1.1.11"
brotli = "9.1.1"

[profile.release]
lto = "thin"
codegen-units = 1
