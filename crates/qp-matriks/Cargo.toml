[package]
name = "qp-matriks"
description = "Matriks MQTT message layer: byte-exact Matriks protos (K62), generated prost types, field-presence-preserving decoders, market clock, broker notices, raw message log. No network, no clock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
prost = "0.14.6"

[build-dependencies]
prost-build = "0.14.6"
prost-types = "0.14.6"
protox = "0.10.0"

[dev-dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"

[lints]
workspace = true
