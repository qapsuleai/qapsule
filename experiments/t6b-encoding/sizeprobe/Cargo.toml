[package]
name = "t6b-sizeprobe"
version = "0.0.0"
edition = "2021"
publish = false
description = "RD1/T6b: wasm32-unknown-unknown binary size per encoding (encode+decode of ServerMsg)."

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
cbor-ciborium = ["dep:ciborium"]
cbor-minicbor = ["dep:minicbor-serde"]
msgpack = ["dep:rmp-serde"]
postcard-mirror = ["dep:postcard"]
qcol = []
json-none = []

[dependencies]
qp-schema = { path = "../../../crates/qp-schema" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
ciborium = { version = "0.2.2", optional = true }
minicbor-serde = { version = "0.7.2", features = ["alloc"], optional = true }
rmp-serde = { version = "1.3.1", optional = true }
postcard = { version = "1.1.3", features = ["alloc"], optional = true }

# Same settings as the main workspace's `wasm` profile, plus strip for a clean size.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
