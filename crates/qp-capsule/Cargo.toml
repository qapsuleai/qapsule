[package]
name = "qp-capsule"
description = "Qapsule capsule engine: findings, evidence families, story lifecycle, ledger, ranking, sentences, sensitivity, server-fact commentary. Deterministic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qp-schema = { path = "../qp-schema" }
qp-facts = { path = "../qp-facts" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[lints]
workspace = true
