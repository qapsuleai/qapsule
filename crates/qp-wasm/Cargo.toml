[package]
name = "qp-wasm"
description = "Qapsule web binding (thin wrapper over qp-compute, qp-grammar, qp-render and the qp-session replica)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# RP2/T8: the replica binding (`Replica`, qp-session). Off in the default (R0 view) build
# so that its size stays as measured; `scripts/verify.sh` builds it for the native <-> WASM
# replica check.
replica = ["dep:qp-session", "dep:qp-source", "dep:qp-calendar"]
# Spike variant: tiny-skia SIMD pipelines (build with RUSTFLAGS="-C target-feature=+simd128").
simd = ["qp-render/simd"]
# Spike variant: also export the vello_cpu backend for the browser comparison.
spike-vello-cpu = ["qp-render/spike-vello-cpu"]
# Spike variant: also export the vello (WebGPU) backend.
spike-vello-gpu = ["qp-render/spike-vello-gpu", "dep:wasm-bindgen-futures"]

[dependencies]
# RP3/M12c: the GPU paint path's glyph atlas (the same fontdue as qp-render, already in
# the build through it; named here for its `Font` type).
fontdue = { version = "0.9.5", default-features = false }
qp-calendar = { path = "../qp-calendar", optional = true }
qp-compute = { path = "../qp-compute" }
qp-grammar = { path = "../qp-grammar" }
qp-render = { path = "../qp-render" }
qp-schema = { path = "../qp-schema" }
qp-session = { path = "../qp-session", optional = true }
qp-source = { path = "../qp-source", optional = true }
serde_json = "1"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = { version = "0.4", optional = true }

[package.metadata.wasm-pack.profile.release]
# Size is measured on the raw rustc output and on wasm-opt output separately (see
# crates/qp-render/SPIKE.md); wasm-pack's own wasm-opt step is disabled so builds do not
# depend on downloading binaryen.
wasm-opt = false

[lints]
workspace = true

[[example]]
# R4/T6: the page's opening timed natively (see the file).
name = "startup"
required-features = ["replica"]
