[package]
name = "qp-viewer"
description = "Qapsule viewer connections (görüntüleyici; PROTOCOL §22): the viewer subsystem of the authority (the viewer topic, visible messages, pushed updates), the device's open side over a replica, and the scene, slice and check functions both sides use."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qp-authority = { version = "0.0.0", path = "../qp-authority" }
qp-capsule = { version = "0.0.0", path = "../qp-capsule" }
qp-compute = { version = "0.0.0", path = "../qp-compute" }
qp-designs = { version = "0.0.0", path = "../qp-designs" }
qp-facts = { version = "0.0.0", path = "../qp-facts" }
qp-grammar = { version = "0.0.0", path = "../qp-grammar" }
qp-look = { version = "0.0.0", path = "../qp-look" }
qp-ops = { version = "0.0.0", path = "../qp-ops" }
qp-plane = { version = "0.0.0", path = "../qp-plane" }
qp-schema = { version = "0.0.0", path = "../qp-schema" }
qp-source = { version = "0.0.0", path = "../qp-source" }
qp-subsystem = { version = "0.0.0", path = "../qp-subsystem" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[lints]
workspace = true
