[package]
name = "qp-read"
description = "Qapsule reading and presentation (okuma ve sunum): the authority's queries and input gestures as a subsystem — queries, semantic reading (screen, hit), interaction, preview, explanation, binding and capsule queries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qp-capsule = { version = "0.0.0", path = "../qp-capsule" }
qp-compute = { version = "0.0.0", path = "../qp-compute" }
qp-designs = { version = "0.0.0", path = "../qp-designs" }
qp-grammar = { version = "0.0.0", path = "../qp-grammar" }
qp-look = { version = "0.0.0", path = "../qp-look" }
qp-ops = { version = "0.0.0", path = "../qp-ops" }
qp-plane = { version = "0.0.0", path = "../qp-plane" }
qp-schema = { version = "0.0.0", path = "../qp-schema" }
qp-subsystem = { version = "0.0.0", path = "../qp-subsystem" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[lints]
workspace = true
