[package]
name = "qp-live"
description = "Live Matriks MQTT-over-WebSocket connection core (server side only; never part of the WASM package)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Loopback mock broker and token service for tests (this crate's and other crates').
mock = []

[dependencies]
base64 = "0.23.1"
gethostname = "1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
webpki-roots = "1.0.12"

[dev-dependencies]
qp-live = { path = ".", features = ["mock"] }
tempfile = "3.27.0"

[lints]
workspace = true
