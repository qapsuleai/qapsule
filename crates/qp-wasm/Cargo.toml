[package]
name = "qp-wasm"
description = "Qapsule web binding (thin wrapper over qp-render)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Spike variant: tiny-skia SIMD pipelines (build with RUSTFLAGS="-C target-feature=+simd128").
simd = ["qp-render/simd"]

[dependencies]
qp-render = { path = "../qp-render" }
wasm-bindgen = "=0.2.130"

[package.metadata.wasm-pack.profile.release]
# Size is measured on the raw rustc output and on wasm-opt output separately (see
# crates/qp-render/SPIKE.md); wasm-pack's own wasm-opt step is disabled so builds do not
# depend on downloading binaryen.
wasm-opt = false

[lints]
workspace = true
