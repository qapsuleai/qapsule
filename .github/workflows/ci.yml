name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      QP_VERIFY_BROWSER: "1"
    steps:
      # Full history (K93): verify.sh's `config` step needs the merge base with main
      # (or the round's baseline commit); a shallow clone would SKIP it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shells/web-spike/package-lock.json
      # Pinned and built from crates.io (the rustwasm installer site is no longer
      # maintained); rust-cache keeps ~/.cargo/bin between runs.
      - name: Install wasm-pack
        run: command -v wasm-pack || cargo install wasm-pack --version 0.14.0 --locked
      - name: Install Playwright Chromium (with system deps)
        working-directory: shells/web-spike
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify
        run: scripts/verify.sh
      # Informational only (shared runners are noisy): R1 sweep timings and digests on
      # real Linux x86_64, native and wasm (Node). Not a gate.
      - name: Sweep benchmark (informational)
        continue-on-error: true
        run: |
          cargo run --release -p qp-compute --example sweep_bench -- --reps 7
          scripts/wasm-sweep-bench.sh
      - name: Upload golden diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual
          path: |
            target/golden-actual/
            target/web-spike/
          if-no-files-found: ignore
