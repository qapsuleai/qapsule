[package]
name = "t4-memharness"
version = "0.0.0"
edition = "2021"
publish = false

# Not a member of the repo workspace: an experiment of RP3/T4 (memory over a long replay).
[workspace]

[dependencies]
qp-wasm = { path = "../../../../../crates/qp-wasm", features = ["replica"] }
qp-session = { path = "../../../../../crates/qp-session" }
qp-schema = { path = "../../../../../crates/qp-schema" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
debug = false
