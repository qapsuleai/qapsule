[package]
name = "qp-render"
description = "Qapsule render core (headless reference renderer)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Enables tiny-skia's SIMD pipelines. Off by default: the reference renderer
# favours the scalar path for cross-target determinism (see SPIKE.md).
simd = ["tiny-skia/simd"]
# R0 render-stack spikes (comparison only; not used by the library API or tests).
spike-vello-cpu = ["dep:vello_cpu"]
spike-vello-cpu-mt = ["spike-vello-cpu", "vello_cpu/multithreading"]
spike-vello-gpu = ["dep:vello", "dep:pollster"]

[dependencies]
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
fontdue = { version = "0.9.5", default-features = false }
png = "0.18.1"
qp-schema = { path = "../qp-schema" }
vello_cpu = { version = "0.4.0", optional = true, default-features = false, features = ["std", "text", "u8_pipeline", "f32_pipeline"] }
vello = { version = "0.12.0", optional = true }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
# (RF1/G2a) The looks and the glyphs, split out of qp-grammar (tests only).
qp-glyph = { path = "../qp-glyph" }
qp-look = { path = "../qp-look" }
# Tests and examples only: the golden test and the 100k-bar example build their scenes
# with the grammar compiler, fed with study values from the compute core. The renderer
# itself never computes (no qp-compute in [dependencies]).
qp-compute = { path = "../qp-compute" }
qp-grammar = { path = "../qp-grammar" }
serde_json = "1"
# RG1 (§13.3): the synthetic bars of the golden test and the examples
# (`qp_source::synthetic_series`; the renderer itself does not depend on a source).
qp-source = { path = "../qp-source" }
# R3 capsule view fixtures (tests/support/capsule_gen.rs, examples/make_capsule_views.rs):
# real detectors and engine on synthetic bars; the session renders the transcripts.
qp-facts = { path = "../qp-facts" }
qp-capsule = { path = "../qp-capsule" }
qp-session = { path = "../qp-session" }

[[example]]
name = "spike_vello_cpu"
required-features = ["spike-vello-cpu"]

[[example]]
name = "spike_vello_gpu"
required-features = ["spike-vello-gpu"]

[lints]
workspace = true
