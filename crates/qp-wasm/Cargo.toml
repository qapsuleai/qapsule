[package]
name = "qp-wasm"
description = "Qapsule web binding (thin wrapper over qp-compute, qp-grammar, qp-render and the qp-session replica)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# RP2/T8: the replica binding (`Replica`, qp-session). Off in the default (R0 view) build
# so that its size stays as measured; `scripts/verify.sh` builds it for the native <-> WASM
# replica check.
replica = ["dep:qp-session", "dep:qp-shellcore", "dep:qp-capsule"]
# Spike variant: tiny-skia SIMD pipelines (build with RUSTFLAGS="-C target-feature=+simd128").
simd = ["qp-render/simd"]
# Spike variant: also export the vello_cpu backend for the browser comparison.
spike-vello-cpu = ["qp-render/spike-vello-cpu"]
# Spike variant: also export the vello (WebGPU) backend.
spike-vello-gpu = ["qp-render/spike-vello-gpu", "dep:wasm-bindgen-futures"]

[dependencies]
qp-designs = { path = "../qp-designs" }
qp-compute = { path = "../qp-compute" }
qp-grammar = { path = "../qp-grammar" }
qp-capsule = { path = "../qp-capsule", optional = true }
qp-render = { path = "../qp-render" }
qp-schema = { path = "../qp-schema" }
qp-session = { path = "../qp-session", optional = true }
# RG1/M1a: the shell core (ShellCore, gallery, viewer, drive), re-exported under the old
# paths (`qp_wasm::shell`, …).
qp-shellcore = { path = "../qp-shellcore", optional = true }
# The synthetic bar generator of the `render_synthetic_*` exports (formerly reached
# through the `qp_render::synthetic_bars` wrapper, removed in RG1).
qp-source = { path = "../qp-source" }
serde_json = "1"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
qp-glyph = { path = "../qp-glyph" }
qp-look = { path = "../qp-look" }
# RG1/M1b: the `replica` tests ran in `cargo test --workspace` only because qp-cli enabled
# the feature; this self-dependency keeps them running (as qp-schema does with `validate`).
qp-wasm = { path = ".", features = ["replica"] }

[package.metadata.wasm-pack.profile.release]
# Size is measured on the raw rustc output and on wasm-opt output separately (see
# crates/qp-render/SPIKE.md); wasm-pack's own wasm-opt step is disabled so builds do not
# depend on downloading binaryen (the custom profile below does use wasm-opt).
wasm-opt = false

[package.metadata.wasm-pack.profile.custom]
# RL1/Ö1 (A70): every `wasm-pack --profile wasm` build except web-spike (`--no-opt`; the shell package, the wasm32
# digest and replica checks, the WASM sweep bench) runs wasm-opt with these passes. Measured
# against -Os/-Oz/-O2/-O3 and opt-level z (rounds/RL1/experiments/o1-wasm/RESULT.md): -O1
# plus function reordering gives the smallest gzip and brotli package without slowing the
# compute kernels; -Os/-Oz shrink the raw file more but compress worse. wasm-opt drops the
# function-name section (it is not run with -g). wasm-pack fetches binaryen once (cached).
wasm-opt = ["-O1", "--duplicate-function-elimination", "--reorder-functions", "--reorder-locals"]

[lints]
workspace = true

[[example]]
# R4/T6: the page's opening timed natively (see the file).
name = "startup"
required-features = ["replica"]
