[package]
name = "qp-session"
description = "Qapsule session composition: the public façade of the qp/0 authority (qp-authority) and the place where the standard subsystems are registered."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qp-authority = { version = "0.0.0", path = "../qp-authority" }
qp-source = { version = "0.0.0", path = "../qp-source" }
qp-subsystem = { version = "0.0.0", path = "../qp-subsystem" }
# The standard subsystems (one line each in `compose`).
qp-watch = { version = "0.0.0", path = "../qp-watch" }
qp-read = { version = "0.0.0", path = "../qp-read" }
# The clients of the authority the composition builds with its lists.
qp-replayhost = { version = "0.0.0", path = "../qp-replayhost" }
# The conformance runner (`conform`).
qp-ops = { version = "0.0.0", path = "../qp-ops" }
qp-plane = { version = "0.0.0", path = "../qp-plane" }
qp-schema = { version = "0.0.0", path = "../qp-schema" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
# Inline transcript inits handed to `qp serve` (securely created temp files).
tempfile = "3.27.0"

# The authority's integration tests and examples stayed here: they test the façade
# (`qp_session::…`) every caller uses.
[dev-dependencies]
qp-capsule = { version = "0.0.0", path = "../qp-capsule" }
qp-compute = { version = "0.0.0", path = "../qp-compute" }
qp-designs = { version = "0.0.0", path = "../qp-designs" }
qp-grammar = { version = "0.0.0", path = "../qp-grammar" }
qp-look = { version = "0.0.0", path = "../qp-look" }
schemars = "1.2.3"

[lints]
workspace = true
