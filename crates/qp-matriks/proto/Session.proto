//"MARKETID", "1STSESSIONSTART", "1STSESSIONEND", "2NDSESSIONSTART", "2NDSESSIONEND", "TIMESTAMP", "EXCHANGEID", "BINARY_MSG_TYPE"
syntax="proto2";
package messages;

option java_package = "com.matriksdata.radix.messages";
option java_outer_classname = "Session";

message SessionMessage {
    required int32 date = 1 ;
    required int32 first_session_start = 2;
    required int32 first_session_end = 3;
    required int32 second_session_start = 4;
    required int32 second_session_end = 5;
    required int32 exchange_id = 6;
    required int32 market_id = 7;
}