[package]
name = "qp-grammar"
description = "Qapsule visual grammar compiler: view + data provider -> scene description (deterministic)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qp-schema = { path = "../qp-schema" }
# (RF1/G2a) Looks, themes, the error type and detmath; the meaning glyphs.
qp-look = { path = "../qp-look" }
qp-glyph = { path = "../qp-glyph" }
# (RD2/C2a-fix) Display zone of the time labels (K14).
qp-calendar = { path = "../qp-calendar" }

[dev-dependencies]
# Tests only: study values for the providers and the frozen R0 oracle (tests/r0_oracle).
qp-compute = { path = "../qp-compute" }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set"] }

[lints]
workspace = true
