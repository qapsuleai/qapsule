[package]
name = "qp-cli"
description = "`qp` command line for agents and tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "qp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
qp-compute = { version = "0.0.0", path = "../qp-compute" }
qp-grammar = { version = "0.0.0", path = "../qp-grammar" }
qp-host = { version = "0.0.0", path = "../qp-host" }
qp-mcp = { version = "0.0.0", path = "../qp-mcp" }
qp-render = { version = "0.0.0", path = "../qp-render" }
qp-schema = { version = "0.0.0", path = "../qp-schema", features = ["validate"] }
qp-session = { version = "0.0.0", path = "../qp-session" }
qp-source = { version = "0.0.0", path = "../qp-source" }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[lints]
workspace = true

[dev-dependencies]
flate2 = "1"
prost = "0.14.6"
qp-calendar = { version = "0.0.0", path = "../qp-calendar" }
qp-compute = { path = "../qp-compute" }
qp-live = { path = "../qp-live", features = ["mock"] }
qp-matriks = { version = "0.0.0", path = "../qp-matriks" }
# RG1/M1b: not used by qp-cli's code or tests. Before M1b qp-cli depended on qp-wasm
# (`replica`), and feature unification made `cargo test --workspace` build and run
# qp-wasm's `replica` tests (74). This test-only edge keeps them running until qp-wasm
# enables its own feature for its tests (a self dev-dependency, as qp-schema does).
qp-wasm = { version = "0.0.0", path = "../qp-wasm", features = ["replica"] }
assert_cmd = "2.2.2"
tempfile = "3.27.0"
