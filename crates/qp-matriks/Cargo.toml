[package]
name = "qp-matriks"
description = "Matriks MQTT message layer: byte-exact Matriks protos (K62), generated prost types, field-presence-preserving decoders, market clock, broker notices, raw message log, live feed (raw records to data events). No network, no clock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
prost = "0.14.6"
qp-calendar = { version = "0.0.0", path = "../qp-calendar" }
qp-schema = { version = "0.0.0", path = "../qp-schema" }
qp-source = { version = "0.0.0", path = "../qp-source" }

[build-dependencies]
prost-build = "0.14.6"
prost-types = "0.14.6"
protox = "0.10.0"

[dev-dependencies]
qp-compute = { path = "../qp-compute" }
# Loopback mock broker for the trade endpoint tests (no network beyond 127.0.0.1).
qp-live = { path = "../qp-live", features = ["mock"] }
tempfile = "3.27.0"
serde_json = "1.0.154"
sha2 = "0.11.1"

[lints]
workspace = true
