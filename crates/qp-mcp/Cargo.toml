[package]
name = "qp-mcp"
description = "MCP server adapter over the qp/0 reference authority: tools generated from the protocol schema, JSON-RPC handling, conformance over MCP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qp-designs = { version = "0.0.0", path = "../qp-designs" }
qp-schema = { version = "0.0.0", path = "../qp-schema" }
qp-render = { version = "0.0.0", path = "../qp-render" }
qp-plane = { version = "0.0.0", path = "../qp-plane" }
qp-session = { version = "0.0.0", path = "../qp-session" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[dev-dependencies]
qp-schema = { path = "../qp-schema", features = ["validate"] }

[lints]
workspace = true
