[package]
name = "qp-cli"
description = "`qp` command line for agents and tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "qp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jsonschema = { version = "0.61.2", default-features = false }
qp-render = { version = "0.0.0", path = "../qp-render" }
qp-schema = { version = "0.0.0", path = "../qp-schema" }
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
