[package]
name = "qp-authority"
description = "Qapsule authority core for protocol qp/0: commands, changes, queries, subscriptions, proposals, log, undo, two worlds, capsule life, claims, live path (the composition `qp-session` is the public façade)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qp-designs = { version = "0.0.0", path = "../qp-designs" }
qp-glyph = { version = "0.0.0", path = "../qp-glyph" }
qp-look = { version = "0.0.0", path = "../qp-look" }
qp-calendar = { version = "0.0.0", path = "../qp-calendar" }
qp-capsule = { version = "0.0.0", path = "../qp-capsule" }
qp-ops = { version = "0.0.0", path = "../qp-ops" }
qp-plane = { version = "0.0.0", path = "../qp-plane" }
qp-compute = { version = "0.0.0", path = "../qp-compute" }
qp-facts = { version = "0.0.0", path = "../qp-facts" }
qp-grammar = { version = "0.0.0", path = "../qp-grammar" }
qp-schema = { version = "0.0.0", path = "../qp-schema" }
qp-source = { version = "0.0.0", path = "../qp-source" }
qp-voice = { version = "0.0.0", path = "../qp-voice" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
serde_path_to_error = "0.1.20"
# Inline transcript inits handed to `qp serve` (securely created temp files).
tempfile = "3.27.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
